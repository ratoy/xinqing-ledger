services:
  ledger:
    # 镜像由 GitHub Actions 构建后推送到 ghcr.io（见 .github/workflows/build-and-push.yml）
    # 本地不再构建，避免 legacy builder 每次部署堆积一堆 <none> 中间层镜像
    image: ghcr.io/ratoy/xinqing-ledger:latest
    container_name: peiwan-ledger
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:3000"
    environment:
      TZ: Asia/Shanghai
      ACCESS_USER: "${ACCESS_USER:-admin}"
      ACCESS_PASSWORD: "${ACCESS_PASSWORD:-}"
    volumes:
      # 命名卷会继承镜像内 /app/data 的 node:node 属主，避免宿主机目录权限问题
      - ledger-data:/app/data

volumes:
  ledger-data:
